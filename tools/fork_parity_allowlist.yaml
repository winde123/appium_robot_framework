# Intentional SGAC1.0 / SGAC2.0 locator divergences — consumed by check_fork_parity.py.
#
# Every entry documents a divergence VERIFIED ON-DEVICE during the Wave 3 locator walks
# (Android T31, iOS T32; see Data/sgac2/*/STATUS.md and docs/refactor/divergence/).
# The linter suppresses exactly these differences and reports any UNUSED entry as an
# error, so the list cannot rot. Add entries only for live-verified divergences.
#
# keys.<rel-path>.sgac1_only : keys allowed to exist in sgac1 but not sgac2 (removed in 2.0)
# keys.<rel-path>.sgac2_only : keys allowed to exist in sgac2 but not sgac1 (new in 2.0)
# files.sgac2_only           : whole YAML files that exist only in the sgac2 tree

files:
  sgac2_only:
    - ios/cargo/vehicle_profiles_page.yaml   # 2.0-only: cargo vehicle-profile redesign
    # Android foreigner tree: SGAC1.0 Android had NO dedicated foreigner tree (it used the
    # shared manual_creation_profile_form.yaml). These are live-verified 2.0 foreigner-flow
    # locators (walk 2026-09-06), mirroring the iOS foreigner layout.
    - android/sgac/foreigner/for_profile_form.yaml
    - android/sgac/foreigner/for_profile_summary.yaml
    - android/sgac/foreigner/for_form_nationality_page.yaml
    - android/sgac/foreigner/for_form_cty_page.yaml
    - android/sgac/foreigner/for_form_residence_page.yaml
  sgac1_only: []

