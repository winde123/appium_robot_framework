# Intentional SGAC1.0 / SGAC2.0 locator divergences — consumed by check_fork_parity.py.
#
# Every entry documents a divergence VERIFIED ON-DEVICE during the Wave 3 locator walks
# (Android T31, iOS T32; see Data/sgac2/*/STATUS.md and docs/refactor/divergence/).
# The linter suppresses exactly these differences and reports any UNUSED entry as an
# error, so the list cannot rot. Add entries only for live-verified divergences.
#
# keys.<rel-path>.sgac1_only : keys allowed to exist in sgac1 but not sgac2 (removed in 2.0)
# keys.<rel-path>.sgac2_only : keys allowed to exist in sgac2 but not sgac1 (new in 2.0)
# files.sgac2_only           : whole YAML files that exist only in the sgac2 tree

files:
  sgac2_only:
    - ios/cargo/vehicle_profiles_page.yaml   # 2.0-only: cargo vehicle-profile redesign
    # Android foreigner tree: SGAC1.0 Android had NO dedicated foreigner tree (it used the
    # shared manual_creation_profile_form.yaml). These are live-verified 2.0 foreigner-flow
    # locators (walk 2026-09-06), mirroring the iOS foreigner layout.
    - android/sgac/foreigner/for_profile_form.yaml
    - android/sgac/foreigner/for_profile_summary.yaml
    - android/sgac/foreigner/for_form_nationality_page.yaml
    - android/sgac/foreigner/for_form_cty_page.yaml
    - android/sgac/foreigner/for_form_residence_page.yaml
  sgac1_only: []

keys:
  android/landing_page.yaml:
    sgac1_only: [MYICA-SCAM-BANNER-HEADER-ELEM]      # scam banner lost its text header in 2.0
  android/sgac/sgac_landing_page.yaml:               # profile-centric SGAC redesign (T33)
    sgac1_only: [SGAC-ADD-GROUP-SUBMISSION-CARD, SGAC-ADD-INDIVIDUAL-SUBMISSION-CARD,
                 SGAC-FLOATING-OPTIONS-BUTTON, SGAC-GROUP-SUBMISSION-BUTTON,
                 SGAC-GROUP-SUBMISSION-HEADER, SGAC-INDIVIDUAL-SUBMISSION-BUTTON,
                 SGAC-INDIVIDUAL-SUBMISSION-HEADER, SGAC-SECTION-CITIZEN-RESIDENT,
                 SGAC-SUBMITTED-DECLARATIONS-BUTTON, SGAC-TUTORIAL-NAV-SGAC-BTN,
                 SGAC-VIEW-PROFILE-BUTTON]
    sgac2_only: [SGAC-ADD-PROFILE-BUTTON, SGAC-CREATE-NEW-PROFILE-BUTTON,
                 SGAC-MANAGE-PROFILES-BUTTON, SGAC-UPDATE-ARRIVAL-CARD-BUTTON]
  ios/landing_page.yaml:
    sgac1_only: [MYICA-SCAM-BANNER-HEADER-ELEM]      # same as Android
    sgac2_only: ['CITIZEN&RESIDENT-SGARRIVAL-CARD-FAV-BUTTON',
                 FORIEGNVISITOR-SGARRIVAL-CARD-FAV-BUTTON, QR-CODE-FAV-BUTTON,
                 REGISTER-REREGISTER-REPLACE-FAV-BUTTON]  # favourites keyed per-tile in 2.0 walk
  ios/sgac/sgac_landing_page.yaml:                   # profile-centric SGAC redesign (T33)
    sgac1_only: [SGAC-LANDING-ADD-BUTTON, SGAC-LANDING-CITIZEN-RESIDENT-SECTION,
                 SGAC-LANDING-GROUP-SECTION, SGAC-LANDING-GROUP-SUBMISSION,
                 SGAC-LANDING-GROUP-SUBMISSION-ADD-ICON, SGAC-LANDING-INDIVIDUAL-SECTION,
                 SGAC-LANDING-INDIVIDUAL-SUBMISSION, SGAC-LANDING-SUBMITTED-DECLARATIONS,
                 SGAC-LANDING-VIEW-ALL-INDV-SUBMISSIONS, SGAC-LANDING-VIEW-PROFILE,
                 SGAC-TUTORIAL-NAV-SGAC-BTN]
    sgac2_only: [SGAC-LANDING-ADD-PROFILE, SGAC-LANDING-CREATE-NEW-PROFILE,
                 SGAC-LANDING-MANAGE-PROFILES, SGAC-LANDING-SELECT-PROFILES-SECTION,
                 SGAC-LANDING-UPDATE-ARRIVAL-CARD, SGAC-LANDING-UPDATE-WEBVIEW-MARKER,
                 SGAC-LANDING-PROFILE-SELECT-HINT, SGAC-LANDING-EMPTY-STATE-HINT,
                 SGAC-LANDING-PROFILE-CARD-MENU, SGAC-LANDING-CONTINUE,
                 SGAC-LANDING-CARD-MENU-VIEW-EDIT, SGAC-LANDING-CARD-MENU-DELETE,
                 SGAC-LANDING-DELETE-CONFIRM-ALERT, SGAC-LANDING-DELETE-CONFIRM-BUTTON,
                 SGAC-LANDING-PROFILE-UPDATE-ALERT, SGAC-LANDING-PROFILE-UPDATE-BUTTON,
                 SGAC-LANDING-PROFILE-UPDATE-CANCEL]
  ios/sgac/profile_list_page.yaml:
    sgac2_only: [RES-PROFILE-LIST-CARD-DELETE]       # delete affordance on profile cards, new in 2.0
  ios/sgac/resident/res_profile_form_page.yaml:      # 3-page Add Profile flow in 2.0
    sgac1_only: [RES-FORM-CTY-CODE-INPUT, RES-FORM-CTY-CODE-REQUIRED,
                 RES-FORM-MOBILE-NUMBER-INPUT, RES-FORM-MOBILE-NUMBER-LABEL,
                 RES-FORM-MOBILE-NUMBER-REQUIRED]    # contact page is email-only in 2.0
    sgac2_only: [RES-FORM-EDIT-HEADER, RES-FORM-MASKED-FIELD-NOTE,
                 RES-FORM-FOOTER-NEXT, RES-FORM-FOOTER-STEP-1, RES-FORM-FOOTER-STEP-2,
