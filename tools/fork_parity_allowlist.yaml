                 RES-FORM-NATIONALITY-REQUIRED, RES-FORM-NATIONALITY-SEARCH,
                 RES-FORM-NATIONALITY-VALUE, RES-FORM-PASSPORT-EXPIRY-INPUT,
                 RES-FORM-PASSPORT-EXPIRY-LABEL, RES-FORM-PASSPORT-EXPIRY-REQUIRED,
                 RES-FORM-PASSPORT-NUMBER-INPUT, RES-FORM-PASSPORT-NUMBER-REQUIRED]
  ios/sgac/resident/res_profile_summary.yaml:
    sgac1_only: [RES-DECL-SUMMARY-COUNTRY-CODE-LABEL, RES-DECL-SUMMARY-COUNTRY-CODE-VALUE,
                 RES-DECL-SUMMARY-MOBILE-LABEL, RES-DECL-SUMMARY-MOBILE-VALUE,
                 RES-DECL-SUMMARY-TERMS-LINK]        # email-only contact; terms link merged
    sgac2_only: [RES-DECL-SUMMARY-NATIONALITY-LABEL, RES-DECL-SUMMARY-NATIONALITY-VALUE,
                 RES-DECL-SUMMARY-PASSPORT-EXPIRY-LABEL, RES-DECL-SUMMARY-PASSPORT-EXPIRY-VALUE,
                 RES-DECL-SUMMARY-PASSPORT-NUMBER-LABEL, RES-DECL-SUMMARY-PASSPORT-NUMBER-VALUE]
  ios/foreign_vis_page.yaml:                         # page removed in 2.0 (routes into SGAC landing)
    sgac1_only: [FOREIGN-VIS-BACK-BUTTON, FOREIGN-VIS-CARGO-CLEARANCE-CARD,
                 FOREIGN-VIS-CARGO-CLEARANCE-RIGHT-ICON, FOREIGN-VIS-CARGO-CLEARANCE-TITLE,
                 FOREIGN-VIS-CBNI-RETRIEVE-VOID-CARD, FOREIGN-VIS-CBNI-RETRIEVE-VOID-RIGHT-ICON,
                 FOREIGN-VIS-CBNI-RETRIEVE-VOID-TITLE, FOREIGN-VIS-CBNI-SUBMIT-CARD,
                 FOREIGN-VIS-CBNI-SUBMIT-RIGHT-ICON, FOREIGN-VIS-CBNI-SUBMIT-TITLE,
                 FOREIGN-VIS-CUSTOMS-DECLARATION-CARD, FOREIGN-VIS-CUSTOMS-DECLARATION-RIGHT-ICON,
                 FOREIGN-VIS-CUSTOMS-DECLARATION-TITLE, FOREIGN-VIS-EXTEND-STAY-CARD,
                 FOREIGN-VIS-EXTEND-STAY-RIGHT-ICON, FOREIGN-VIS-EXTEND-STAY-TITLE,
                 FOREIGN-VIS-HEADER, FOREIGN-VIS-LTVP-CARD, FOREIGN-VIS-LTVP-RIGHT-ICON,
                 FOREIGN-VIS-LTVP-TITLE, FOREIGN-VIS-QR-CODE-CARD, FOREIGN-VIS-QR-CODE-RIGHT-ICON,
                 FOREIGN-VIS-QR-CODE-TITLE, FOREIGN-VIS-SGAC-CARD, FOREIGN-VIS-SGAC-RIGHT-ICON,
                 FOREIGN-VIS-SGAC-TITLE, FOREIGN-VIS-VISITOR-ESERVICES-CARD,
                 FOREIGN-VIS-VISITOR-ESERVICES-RIGHT-ICON, FOREIGN-VIS-VISITOR-ESERVICES-TITLE]
    sgac2_only: [FOREIGN-SGAC-EMPTY-STATE-HINT]
  ios/cargo/cargo_landing_page.yaml:                 # cargo profile-centric redesign
    sgac1_only: [CARGO-CONVOY-SHORTCUT-BTN]
    sgac2_only: [CARGO-LANDING-ADD-VEHICLE-PROFILE, CARGO-LANDING-BACK-BUTTON,
                 CARGO-LANDING-CONVOY-CLEARANCE, CARGO-LANDING-CREATE-VEHICLE-PROFILE,
                 CARGO-LANDING-EMPTY-STATE-HINT, CARGO-LANDING-HEADER,
                 CARGO-LANDING-LANGUAGE-BUTTON, CARGO-LANDING-MANAGE-SUBMISSION,
                 CARGO-LANDING-SELECT-VEHICLE-PROFILES-SECTION]
