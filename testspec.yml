version: 0.1

android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - devicefarm-cli use node 18
      - node --version

      - devicefarm-cli use appium 3
      - appium --version

      - export APPIUM_BASE_PATH=/wd/hub

      - devicefarm-cli use python 3.10
      - python --version

      - cd "$DEVICEFARM_TEST_PACKAGE_PATH"
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt

  pre_test:
    commands:
      - |-
        if [ "$(echo "$DEVICEFARM_DEVICE_OS_VERSION" | cut -d "." -f 1)" -le 16 ]; then
          DEVICEFARM_DEVICE_UDID_FOR_APPIUM="$(echo "$DEVICEFARM_DEVICE_UDID" | tr -d "-")"
        else
          DEVICEFARM_DEVICE_UDID_FOR_APPIUM="$DEVICEFARM_DEVICE_UDID"
        fi
        export DEVICEFARM_DEVICE_UDID_FOR_APPIUM

      - |-
        appium --base-path=$APPIUM_BASE_PATH --log-timestamp \
          --log-no-colors --relaxed-security --default-capabilities \
          "{\"appium:deviceName\": \"$DEVICEFARM_DEVICE_NAME\", \
          \"platformName\": \"$DEVICEFARM_DEVICE_PLATFORM_NAME\", \
          \"appium:app\": \"$DEVICEFARM_APP_PATH\", \
          \"appium:udid\":\"$DEVICEFARM_DEVICE_UDID_FOR_APPIUM\", \
          \"appium:platformVersion\": \"$DEVICEFARM_DEVICE_OS_VERSION\", \
          \"appium:automationName\": \"XCUITest\"}" \
          >> $DEVICEFARM_LOG_DIR/appium.log 2>&1 &

      - |-
        appium_initialization_time=0;
        until curl --silent --fail "http://0.0.0.0:4723${APPIUM_BASE_PATH}/status"; do
          if [[ $appium_initialization_time -gt 30 ]]; then
            echo "Appium did not start within 30 seconds. Exiting...";
            exit 1;
          fi;
          appium_initialization_time=$((appium_initialization_time + 1));
          echo "Waiting for Appium to start on port 4723...";
          sleep 1;
        done;

  test:
    commands:
      - cd "$DEVICEFARM_TEST_PACKAGE_PATH"
      - export TEST_SUITE_PATH=tests/ios/sgac/crud_for_profile.robot
      - echo "Starting the Appium Robot test (iOS)"
      - |-
        robot \
          -d "$DEVICEFARM_LOG_DIR" \
          --variable APPIUM_SERVER_URL:http://127.0.0.1:4723/wd/hub \
          --variable IOS_PLATFORM_NAME:iOS \
          --variable IOS_AUTOMATION_NAME:XCUITest \
          --variable IOS_PLATFORM_VERSION:"$DEVICEFARM_DEVICE_OS_VERSION" \
          --variable IOS_DEVICE_NAME:"$DEVICEFARM_DEVICE_NAME" \
          --variable IOS_DEVICE_UDID:"$DEVICEFARM_DEVICE_UDID_FOR_APPIUM" \
          --variable IOS_XCODE_ORGID:AWS \
          --variable IOS_APP:"$DEVICEFARM_APP_PATH" \
          "$TEST_SUITE_PATH"

  post_test:
    commands:

artifacts:
  - $DEVICEFARM_LOG_DIR
