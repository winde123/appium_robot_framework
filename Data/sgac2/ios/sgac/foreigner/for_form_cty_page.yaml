# selectors for SGAC Foreigner Country List modal (iOS)
FOR-CTY-MODAL: //XCUIElementTypeOther[@name="modal"]
FOR-CTY-SEARCH-INPUT: //XCUIElementTypeTextField[@placeholderValue="Search"]
FOR-CTY-SEARCH-CLEAR: (//XCUIElementTypeButton[@name="icon-button"])[2]
FOR-CTY-CLOSE-BUTTON: (//XCUIElementTypeButton[@name="icon-button"])[1]

# Country options
FOR-CTY-OPTION-BY-NAME: //XCUIElementTypeOther[starts-with(@name,"searchable dropdown accessible label ")]
FOR-CTY-OPTION-1: (//XCUIElementTypeOther[starts-with(@name,"searchable dropdown accessible label ")])[1]
FOR-CTY-OPTION-2: (//XCUIElementTypeOther[starts-with(@name,"searchable dropdown accessible label ")])[2]
FOR-CTY-OPTION-3: (//XCUIElementTypeOther[starts-with(@name,"searchable dropdown accessible label ")])[3]
