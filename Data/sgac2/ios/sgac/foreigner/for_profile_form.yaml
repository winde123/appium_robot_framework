# selectors for SGAC Foreigner Profile Form page (iOS) — SGAC2.0
# Correctness walk 2026-09-06 (drove the full flow on the live 2.0 iPad build). 3-page flow:
# p1 Profile Details (this file) -> p2 Contact Details (this file) -> p3 summary
# (for_profile_summary.yaml). The Country/Place of Birth, Nationality and Place of Residence
# fields open searchable modals (for_form_cty_page / for_form_nationality_page /
# for_form_residence_page — all verified unchanged 8/8). DIVERGENCES from sgac1: DOB/Expiry
# labels lost the "(DD/MM/YYYY)" text (now keyed on the language-independent -label-inactive
# testID); the standalone "Full Name (In Passport)" label element is gone; and the Contact
# page is now Place of Residence + Email ONLY (sgac1's country-code + mobile fields removed).
# Key divergences recorded in tools/fork_parity_allowlist.yaml.
FOR-PROFILE-FORM-BACK-BUTTON: //XCUIElementTypeButton[@name="back"]
FOR-PROFILE-FORM-HEADER: //XCUIElementTypeStaticText[@name="Add Profile"]

# Profile details section
FOR-PROFILE-FORM-DETAILS-HEADER: //XCUIElementTypeStaticText[@name="Profile Details"]
FOR-PROFILE-FORM-DETAILS-NOTE: //XCUIElementTypeStaticText[@name="Profile retrieved from Singpass is not editable."]

# Full name
FOR-PROFILE-FORM-NAME-INPUT: //XCUIElementTypeOther[@name="Full Name (In Passport)text input"]
# FOR-PROFILE-FORM-FULL-NAME-LABEL removed in 2.0 — no standalone "Full Name (In Passport)"
#   StaticText (the label is folded into the input wrapper name)
FOR-PROFILE-FORM-FULL-NAME-REQUIRED: (//XCUIElementTypeStaticText[@name="Required"])[1]

# Gender / Date of Birth
FOR-PROFILE-FORM-GENDER-DROPDOWN: //XCUIElementTypeOther[@name="dropdown"]
# Gender choices
FEMALE-DROPDOWN-OPTION: //XCUIElementTypeButton[@name="FEMALE"]
MALE-DROPDOWN-OPTION: //XCUIElementTypeButton[@name="MALE"]
OTHERS-DROPDOWN-OPTION: //XCUIElementTypeButton[@name="OTHERS"]

FOR-PROFILE-FORM-DOB-INPUT: //XCUIElementTypeTextField[@name="PassportDetailsDateOfBirth"]
FOR-PROFILE-FORM-DOB-LABEL: //XCUIElementTypeStaticText[@name="PassportDetailsDateOfBirth-label-inactive"]
FOR-PROFILE-FORM-DOB-CALENDAR: //XCUIElementTypeButton[@name="right-icon-adornment" and contains(@label,"calendar picker")]
FOR-PROFILE-FORM-GENDER-REQUIRED: (//XCUIElementTypeStaticText[@name="Required"])[2]
FOR-PROFILE-FORM-DOB-REQUIRED: (//XCUIElementTypeStaticText[@name="Required"])[3]

# Country/place of birth
FOR-PROFILE-FORM-CTY-BIRTH-LIST: //XCUIElementTypeOther[@name="country/place of birth list"]
FOR-PROFILE-FORM-COUNTRY-BIRTH-REQUIRED: (//XCUIElementTypeStaticText[@name="Required"])[4]

# Nationality/citizenship
FOR-PROFILE-FORM-NAT-LIST: //XCUIElementTypeOther[@name="nationality/citizenship list"]
FOR-PROFILE-FORM-NATIONALITY-REQUIRED: (//XCUIElementTypeStaticText[@name="Required"])[5]

# Passport details
FOR-PROFILE-FORM-PASSPORT-NO-INPUT: //XCUIElementTypeOther[@name="passport numbertext input"]
FOR-PROFILE-FORM-PASSPORT-NUMBER-REQUIRED: (//XCUIElementTypeStaticText[@name="Required"])[6]

FOR-PROFILE-FORM-PASSPORT-EXPIRY-INPUT: //XCUIElementTypeTextField[@name="PassportDetailsDatePassportExpiry"]
FOR-PROFILE-FORM-PASSPORT-EXPIRY-LABEL: //XCUIElementTypeStaticText[@name="PassportDetailsDatePassportExpiry-label-inactive"]
FOR-PROFILE-FORM-PASSPORT-EXPIRY-CALENDAR: //XCUIElementTypeButton[@name="right-icon-adornment" and contains(@label,"passport expiry")]
FOR-PROFILE-FORM-PASSPORT-EXPIRY-REQUIRED: (//XCUIElementTypeStaticText[@name="Required"])[7]

# Footer navigation
#FOR-PROFILE-FORM-FOOTER-BACK: //XCUIElementTypeOther[@name="back" and @label="back"]
FOR-PROFILE-FORM-FOOTER-STEP: //XCUIElementTypeOther[@name="Step 1 of 3"]
#FOR-PROFILE-FORM-FOOTER-NEXT: //XCUIElementTypeOther[@name="next" and @label="next"]

# Contact details section (page 2 — Place of Residence + Email ONLY in 2.0)
FOR-PROFILE-FORM-CONTACT-HEADER: //XCUIElementTypeStaticText[@name="Contact Details"]

# Place of Residence (opens for_form_residence_page modal; COUNTRY, CITY, CITY options)
FOR-PROFILE-FORM-CITY-RES-INPUT: //XCUIElementTypeOther[@name="city of residence text input"]
FOR-PROFILE-FORM-CITY-RESIDENCE-REQUIRED: (//XCUIElementTypeOther[@name="city of residence text input"]/following::XCUIElementTypeStaticText[@name="Required"])[1]

# --- sgac1-only, REMOVED in 2.0 (contact is residence + email; kept commented for T33) ---
# FOR-PROFILE-FORM-COUNTRY-CODE-INPUT / -REQUIRED : country/region code field gone
# FOR-PROFILE-FORM-MOBILE-NO-INPUT / -REQUIRED    : mobile number field gone

FOR-PROFILE-FORM-EMAIL-INPUT: //XCUIElementTypeOther[@name="email address text inputtext input"]
FOR-PROFILE-FORM-EMAIL-REQUIRED: (//XCUIElementTypeOther[@name="email address text inputtext input"]/following::XCUIElementTypeStaticText[@name="Required"])[1]

FOR-PROFILE-FORM-CONTACT-FOOTER-STEP: //XCUIElementTypeOther[@name="Step 2 of 3"]
