# selectors for SGAC Resident Profile List page (iOS) — SGAC2.0
# (verified 2026-09-06 vs build 2.0.0 on iPad: 6/6 sgac1 keys unchanged, checked with a
# saved profile card present. Reached via SGAC landing "Manage Profiles".)
RES-PROFILE-LIST-BACK-BUTTON: //XCUIElementTypeButton[@name="back"]
RES-PROFILE-LIST-HEADER: //XCUIElementTypeStaticText[@name="Profile"]

# Profile card list
# NOTE: the "No profiles" empty state renders inside the same card-container-outer-layer,
# so FIRST-CARD alone does not prove a profile exists — pair with CARD-ACTION or a name check.
RES-PROFILE-LIST-FIRST-CARD: (//XCUIElementTypeOther[@name="card-container-outer-layer"])[1]
#RES-PROFILE-LIST-FIRST-NAME: (//XCUIElementTypeOther[@name="card-container-outer-layer"])[1]//XCUIElementTypeStaticText
RES-PROFILE-LIST-CARD-ACTION: //XCUIElementTypeButton[@name="profile right card"]
RES-PROFILE-LIST-CARD-DELETE: //XCUIElementTypeOther[@name="Delete"]

# Add profile button
ADD-PROFILE-BTN: //XCUIElementTypeButton[@name="ProfileAddProfile"]

# Back to dashboard button
RES-PROFILE-LIST-BACK-TO-DASHBOARD: //XCUIElementTypeOther[@name="SgacGoBackToDashboard"]
