# SGAC2.0 "Manage Cargo Submission" (Android) — DIVERGED to a WEBVIEW.
# Verified on-device 2026-09-06. SGAC1.0 had a native submissions list (All/Submitted/Draft
# tabs, ADD SUBMISSION, View/Edit, Delete). In 2.0, Cargo landing -> Manage Cargo Submission
# opens an in-app WEBVIEW of the SGAC Cargo portal (retrieve form: Application Reference
# Number (ARN) + Vehicle Number + Retrieve). The web inputs are generic (resource-id
# "text-input"), so distinct native locators are not available — drive by DOM/label if the
# suite needs it (requires staging tunnel). All sgac1 native keys removed (see parity allowlist).
CARGO-MANAGE-SUBMISSION-WEBVIEW-MARKER: //android.webkit.WebView[@text="ICA | SGAC Cargo"]
CARGO-MANAGE-SUBMISSION-HEADER: //android.widget.TextView[@text="Manage Cargo Submission"]
CARGO-MANAGE-SUBMISSION-ARN-LABEL: //android.widget.TextView[@text="Application Reference Number(ARN) *"]
CARGO-MANAGE-SUBMISSION-VEHICLE-LABEL: //android.widget.TextView[@text="Vehicle Number *"]
CARGO-MANAGE-SUBMISSION-RETRIEVE-BUTTON: //android.widget.Button[@text="Retrieve"]
