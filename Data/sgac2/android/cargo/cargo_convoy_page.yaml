# SGAC2.0 Convoy Clearance (Android) — DIVERGED to a WEBVIEW.
# Verified on-device 2026-09-06. SGAC1.0 had a native convoy list (All/Submitted/Draft tabs,
# ADD CARGO CONVOY, NRIC/Email/Vehicle fields). In 2.0, Cargo landing -> Convoy opens an in-app
# WEBVIEW of the SGAC Cargo convoy portal ("Convoy Submission" / "Convoy Information", Email +
# Mobile fields; "A Singapore Government Agency Website"; est. 5-7 mins). No in-app testIDs; the
# permit sub-flow (add_permit_page.yaml) lives inside this web flow. All sgac1 native keys
# removed (see parity allowlist); drive by DOM if the suite needs it (requires staging tunnel).
CARGO-CONVOY-WEBVIEW-MARKER: //android.webkit.WebView[@text="ICA | SGAC Cargo"]
CARGO-CONVOY-SUBMISSION-HEADER: //android.widget.TextView[@text="Convoy Submission"]
CARGO-CONVOY-INFORMATION-SECTION: //android.widget.TextView[@text="Convoy Information"]
CARGO-CONVOY-EMAIL-LABEL: //android.widget.TextView[@text="Email Address *"]
CARGO-CONVOY-MOBILE-LABEL: //android.widget.TextView[@text="Mobile Number *"]
