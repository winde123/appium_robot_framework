# SGAC2.0 Vehicle Profiles list (Android) — verified on-device 2026-09-06 (with a saved
# profile SOX3229J). Reached via Cargo landing -> Create New Vehicle Profiles. List items are
# indexed: card content-desc "vehicle list N", kebab "vehicle list right iconN" (N from 0);
# the kebab opens Edit / Delete. Key divergence from sgac1 recorded in the parity allowlist.
VEHICLE-PROFILES-HEADER: //android.widget.TextView[@text="Vehicle Profiles"]
VEHICLE-PROFILES-BACK-BUTTON: //android.widget.Button[@resource-id="back"]
VEHICLE-PROFILES-ADD-VEHICLE-BUTTON: //android.widget.Button[@resource-id="VehicleProfilesAddVehicle"]
VEHICLE-PROFILES-EMPTY-STATE: //android.widget.TextView[@text="No vehicle profiles"]
# List item (index 0). Format-String the index for other rows.
VEHICLE-PROFILES-FIRST-CARD: //android.view.ViewGroup[@content-desc="vehicle list 0"]
VEHICLE-PROFILES-FIRST-KEBAB: //android.widget.Button[@content-desc="vehicle list right icon0"]
VEHICLE-PROFILES-CARD-TEMPLATE: //android.view.ViewGroup[@content-desc="vehicle list {}"]
VEHICLE-PROFILES-KEBAB-TEMPLATE: //android.widget.Button[@content-desc="vehicle list right icon{}"]
# Kebab menu actions
VEHICLE-PROFILES-EDIT: //android.view.ViewGroup[@content-desc="Edit"]
VEHICLE-PROFILES-DELETE: //android.view.ViewGroup[@resource-id="Delete"]
