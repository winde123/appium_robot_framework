# selectors for SGAC Foreigner Profile Summary / confirmation (Android, page 3 of 3) — SGAC2.0
# (verified on-device 2026-09-06, full flow driven to this page). Two cards: Passport Details
# (Full Name, Sex, DOB, Country/Place of Birth, Nationality, Passport No., Passport Expiry) and
# Contact Details (Place of Residence, Email Address). sgac2-only — see parity allowlist.
FOR-PROFILE-SUMMARY-HEADER: //android.widget.TextView[@text="Add Profile"]
FOR-PROFILE-SUMMARY-BACK-BUTTON: //android.widget.Button[@content-desc="Back"]
FOR-PROFILE-SUMMARY-PROGRESS-BAR: //android.view.View[@resource-id="progress-bar"]

# Passport Details card
FOR-PROFILE-SUMMARY-PASSPORT-CARD: //android.view.ViewGroup[@resource-id="card"]
FOR-PROFILE-SUMMARY-PASSPORT-TITLE: //android.widget.TextView[@text="Passport Details"]
FOR-PROFILE-SUMMARY-FULL-NAME-LABEL: //android.widget.TextView[@text="Full Name (In Passport)"]
FOR-PROFILE-SUMMARY-SEX-LABEL: //android.widget.TextView[@text="Sex"]
FOR-PROFILE-SUMMARY-DOB-LABEL: //android.widget.TextView[@text="Date of Birth"]
FOR-PROFILE-SUMMARY-CTY-BIRTH-LABEL: //android.widget.TextView[@text="Country/Place of Birth"]
FOR-PROFILE-SUMMARY-NATIONALITY-LABEL: //android.widget.TextView[@text="Nationality/Citizenship"]
FOR-PROFILE-SUMMARY-PASSPORT-NO-LABEL: //android.widget.TextView[@text="Passport Number"]
FOR-PROFILE-SUMMARY-PASSPORT-EXPIRY-LABEL: //android.widget.TextView[@text="Date of Passport Expiry"]
FOR-PROFILE-SUMMARY-PASSPORT-EDIT: (//android.view.ViewGroup[@content-desc="Edit"])[1]

# Contact Details card
FOR-PROFILE-SUMMARY-CONTACT-TITLE: //android.widget.TextView[@text="Contact Details"]
FOR-PROFILE-SUMMARY-RESIDENCE-LABEL: //android.widget.TextView[@text="Place of Residence"]
FOR-PROFILE-SUMMARY-EMAIL-LABEL: //android.widget.TextView[@text="Email Address"]
FOR-PROFILE-SUMMARY-CONTACT-EDIT: (//android.view.ViewGroup[@content-desc="Edit"])[2]

# Terms of Use + save
FOR-PROFILE-SUMMARY-TERMS-CHECKBOX-UNCHECKED: //android.view.ViewGroup[@content-desc="uncheckterms of use checkbox"]
FOR-PROFILE-SUMMARY-TERMS-CHECKBOX-CHECKED: //android.view.ViewGroup[@content-desc="checkedterms of use checkbox"]
FOR-PROFILE-SUMMARY-TERMS-LINK: //android.view.ViewGroup[@content-desc="Terms of Use and Privacy Policy."]
FOR-PROFILE-SUMMARY-SAVE-BUTTON: //android.view.ViewGroup[@resource-id="save"]
