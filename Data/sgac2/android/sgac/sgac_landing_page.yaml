SGAC-CREATE-NEW-PROFILE-BUTTON: //android.view.ViewGroup[@resource-id="Create New Profile"]
SGAC-UPDATE-ARRIVAL-CARD-BUTTON: //android.view.ViewGroup[@resource-id="Update SG Arrival Card"]
SGAC-ADD-PROFILE-BUTTON: //android.view.ViewGroup[@content-desc="add profile plus icon"]

